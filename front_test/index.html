<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket.IO chat</title>
    <style>
      body { margin: 0; padding-bottom: 3rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

      #form { background: rgba(0, 0, 0, 0.15); padding: 0.25rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; height: 3rem; box-sizing: border-box; backdrop-filter: blur(10px); }
      #input { border: none; padding: 0 1rem; flex-grow: 1; border-radius: 2rem; margin: 0.25rem; }
      #input:focus { outline: none; }
      #form > button { background: #333; border: none; padding: 0 1rem; margin: 0.25rem; border-radius: 3px; outline: none; color: #fff; }

      #messages { list-style-type: none; margin: 0; padding: 0; }
      #messages > li { padding: 0.5rem 1rem; }
      #messages > li:nth-child(odd) { background: #efefef; }
    </style>
  </head>
  <body>
    <ul id="messages"></ul>
    <form id="form" action="">
      <input id="input" autocomplete="off" /><button>Send</button>
    </form>
    <!-- en temps normal : src="https://cdn.socket.io/4.7.5/socket.io.min.js" -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            let test = input.value.split(' ');
            if (test[0] === "newGame"){
                socket.emit('newGame');
            } else if (test[0] === "join") {
                if(test.length == 2){
                    socket.emit('joinGame', test[1]);
                } else {
                    afficherMsg('syntaxe : join #');
                }
            }else if (test[0] === 'placeN'){
                if(test.length === 5){
                    socket.emit('place', {x1: test[1], y1: test[2], x2: test[3], y2: test[4]});
                } else {
                    afficherMsg('syntaxe : placeN x1 y1 x2 y2');
                }
            } else if (test[0] === 'tirer') {
                if(test.length === 3){
                    socket.emit('tirer', {x: test[1], y: test[2]});
                } else {
                    afficherMsg('syntaxe : tirer x y');
                }
            } else if (input.value){
                socket.emit('chat message', input.value);
            }

            input.value = '';
        });

        socket.on('chat message', (msg) => afficherMsg(msg));



        socket.on('newGame', (data) => afficherMsg(JSON.stringify(data)));

        socket.on('join', (player) => afficherMsg(player + ' a rejoint la partie'));
        
        socket.on('noRoom', () => afficherMsg('La Room n\'existe pas'));

        socket.on('fullRoom', () => afficherMsg('Cette Room est pleine'));



        socket.on('dPlacement', () => afficherMsg('Placement des navires : \'placeN x1 y1 x2 y2\''));

        socket.on('fPlacement', () => afficherMsg('Plus de navire disponible'));

        socket.on('badPlacement', () => afficherMsg('Placement Impossible'));



        socket.on('dTirer', () => afficherMsg('Debut tirer : \'tirer x y\''));

        socket.on('badAim', () => afficherMsg('Tire impossible'));       

        socket.on('fTour', (data) => afficherMsg((data.val?'Navire touché':'Loupé') + '\nCoords: ' + data.x + ' ' + data.y));



        socket.on('tour', (tour) => afficherMsg(tour?'C\'est à toi de tirer':'C\'est à l\'adversaire de tirer'));

        socket.on('dGame', () => afficherMsg('Début de la Game'));

        socket.on('fGame', (data) => afficherMsg('Tu as ' + (data?'gagné':'perdu')));
        

        

        socket.on('plateau', (plat) => afficherPlateau(plat));



        function afficherMsg(msg){
            const item = document.createElement('li');
            item.textContent = msg;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        };

        function afficherPlateau(plat){
            if(plat.dimx){
                for(let i = 0; i < plat.dimx; i++){
                    afficherMsg(plat.plateau[i]);
                }
            }
        };

    </script>
  </body>
</html>
